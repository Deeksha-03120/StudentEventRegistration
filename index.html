<!DOCTYPE html>
<html>
<head>
    <title>Student Event Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        h1 {
            text-align: center;
        }

        p {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Event Registration</h1>

    <h2>Tech Innovation Summit 2026</h2>

    <p>
        Join us for an exciting event on technology, innovation,
        artificial intelligence and emerging trends.
    </p>

    <form>

        <label>Student Name</label>
        <input type="text" placeholder="Deeksha" required>

        <label>Register Number</label>
        <input type="text" placeholder="24mis0129" required>

        <label>Department</label>
        <select required>
            <option value="">Select Department</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>MECH</option>
            <option>CIVIL</option>
        </select>

        <label>Email</label>
        <input type="email" placeholder="deeksha.s2024@vitstudent.ac.in" required>

        <label>Event Date</label>
        <input type="date" required>

        <button type="submit">Register for Event</button>

    </form>

</div>

</body>
</html>
